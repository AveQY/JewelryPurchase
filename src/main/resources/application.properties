# MySQL
# local
spring.datasource.url=jdbc:mysql://localhost:3306/jewelrypurchase
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=6601
app.upload-dir=${APP_UPLOAD_DIR:#{systemProperties['os.name'].toLowerCase().contains('win') ? 'F:/log/' : '/opt/JewelryPurchaseWeb/'}}
app.max-file-size=2MB
spring.servlet.multipart.max-file-size=${app.max-file-size}

# UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
spring.mvc.converters.preferred-json-mapper=jackson

# HikariCP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-1
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA
# ?? Hibernate ?? DDL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=true

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true

logging.file.name=logs/myapp.log






